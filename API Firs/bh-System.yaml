openapi: 3.0.3
info:
  title: Breaze & Harold Veterinary System — API completa
  description: 'Especificación OpenAPI combinada del sistema Breaze & Harold Veterinary
    System.


    Este contrato agrupa los dos microservicios del proyecto:

    - **bh-core**: operación principal de la clínica veterinaria.

    - **bh-audit**: trazabilidad interna de acciones del sistema.

  version: 1.0.0
  contact:
    name: Equipo de Desarrollo B&H
    email: dev@bh-vet.com
  license:
    name: Propietario — Breaze & Harold Veterinary System
servers:
- url: https://api.bh-vet.com
  description: Servidor base de producción del sistema
- url: http://localhost
  description: Servidor base local del sistema
tags:
- name: Auth
  description: Registro, verificación e inicio de sesión de usuarios
- name: Usuarios
  description: Administración de cuentas de usuario (solo administrador)
- name: Clientes
  description: Gestión de clientes de la clínica
- name: Mascotas
  description: Gestión de mascotas vinculadas a clientes
- name: Citas
  description: Agendamiento y gestión del ciclo de vida de citas
- name: Historial Médico
  description: Registro y consulta del historial clínico de mascotas
- name: Vacunación
  description: Registro y consulta de vacunas aplicadas
- name: Hospitalización
  description: Internamiento y seguimiento de mascotas hospitalizadas
- name: Inventario
  description: Control de medicamentos, vacunas e insumos quirúrgicos
- name: Servicios
  description: Catálogo de servicios de la clínica
- name: Facturación
  description: Generación y gestión de facturas
- name: Reportes
  description: Generación de reportes en PDF
- name: Audit — Trazabilidad
  description: Recepción, almacenamiento y consulta del historial de acciones del
    sistema.
paths:
  /auth/registro:
    post:
      tags:
      - Auth
      summary: Registrar nuevo usuario
      description: 'Cualquier persona puede crear una cuenta. Al completar el registro
        el sistema

        envía un código de verificación al correo indicado.

        - **cliente**: la cuenta queda activa tras verificar el correo.

        - **recepcionista / veterinario**: requieren aprobación adicional del administrador.

        '
      operationId: registrarUsuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
            example:
              nombre: María García
              email: maria@ejemplo.com
              password: P@ssw0rd123
              telefono: '3001234567'
              rol: cliente
      responses:
        '201':
          description: Usuario registrado. Código de verificación enviado al correo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeResponse'
              example:
                mensaje: Registro exitoso. Revisa tu correo para verificar tu cuenta.
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: El correo ya está registrado en el sistema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                codigo: EMAIL_DUPLICADO
                mensaje: El correo electrónico ya está registrado.
    servers:
    - url: https://api.bh-vet.com/bh-core/v1
      description: Servidor de producción — bh-core
    - url: http://localhost:8080/bh-core/v1
      description: Entorno local — bh-core
  /auth/verificar-correo:
    post:
      tags:
      - Auth
      summary: Verificar correo electrónico con código
      description: "El usuario ingresa el código de verificación recibido por correo.\n\
        - Para **clientes**, la cuenta queda activa inmediatamente.\n- Para **recepcionistas\
        \ y veterinarios**, la cuenta queda en estado `pendiente_aprobacion`\n  hasta\
        \ que el administrador la active.\n"
      operationId: verificarCorreo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificacionCorreoRequest'
            example:
              email: maria@ejemplo.com
              codigo: '482913'
      responses:
        '200':
          description: Correo verificado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeResponse'
              example:
                mensaje: Correo verificado. Tu cuenta está activa.
        '400':
          description: Código inválido o expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                codigo: CODIGO_INVALIDO
                mensaje: El código de verificación es incorrecto o ha expirado.
        '404':
          $ref: '#/components/responses/NotFound'
    servers:
    - url: https://api.bh-vet.com/bh-core/v1
      description: Servidor de producción — bh-core
    - url: http://localhost:8080/bh-core/v1
      description: Entorno local — bh-core
  /auth/login:
    post:
      tags:
      - Auth
      summary: Iniciar sesión
      description: 'Autentica al usuario y devuelve un token JWT.

        Solo los usuarios con cuenta activa pueden iniciar sesión.

        Los intentos fallidos quedan registrados en el servicio de auditoría.

        '
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: maria@ejemplo.com
              password: P@ssw0rd123
      responses:
        '200':
          description: Inicio de sesión exitoso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Credenciales incorrectas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                codigo: CREDENCIALES_INVALIDAS
                mensaje: Email o contraseña incorrectos.
        '403':
          description: Cuenta no activa (pendiente de aprobación o suspendida).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                codigo: CUENTA_INACTIVA
                mensaje: Tu cuenta está pendiente de aprobación por el administrador.
        '400':
          $ref: '#/components/responses/BadRequest'
    servers:
    - url: https://api.bh-vet.com/bh-core/v1
      description: Servidor de producción — bh-core
    - url: http://localhost:8080/bh-core/v1
      description: Entorno local — bh-core
  /usuarios:
    get:
      tags:
      - Usuarios
      summary: Listar usuarios del sistema
      description: Devuelve todos los usuarios registrados. Solo accesible por el
        administrador.
      operationId: listarUsuarios
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RolFiltro'
      - $ref: '#/components/parameters/EstadoCuentaFiltro'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Lista de usuarios.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedUsuarios'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    servers:
    - url: https://api.bh-vet.com/bh-core/v1
      description: Servidor de producción — bh-core
    - url: http://localhost:8080/bh-core/v1
      description: Entorno local — bh-core
  /usuarios/{usuarioId}:
    get:
      tags:
      - Usuarios
      summary: Obtener usuario por ID
      operationId: obtenerUsuario
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/UsuarioId'
      responses:
        '200':
          description: Datos del usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    servers:
    - url: https://api.bh-vet.com/bh-core/v1
      description: Servidor de producción — bh-core
    - url: http://localhost:8080/bh-core/v1
      description: Entorno local — bh-core
  /usuarios/{usuarioId}/aprobar:
    patch:
      tags:
      - Usuarios
      summary: Aprobar cuenta de recepcionista o veterinario
      description: 'El administrador aprueba manualmente la cuenta de un recepcionista
        o veterinario

        que ha verificado su correo y está en estado `pendiente_aprobacion`.

        '
      operationId: aprobarUsuario
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/UsuarioId'
      responses:
        '200':
          description: Cuenta aprobada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeResponse'
        '400':
          description: El usuario no está en estado pendiente de aprobación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    servers:
    - url: https://api.bh-vet.com/bh-core/v1
      description: Servidor de producción — bh-core
    - url: http://localhost:8080/bh-core/v1
      description: Entorno local — bh-core
  /usuarios/{usuarioId}/rechazar:
    patch:
      tags:
      - Usuarios
      summary: Rechazar cuenta de recepcionista o veterinario
      operationId: rechazarUsuario
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/UsuarioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MotivoRequest'
      responses:
        '200':
          description: Cuenta rechazada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
    servers:
    - url: https://api.bh-vet.com/bh-core/v1
      description: Servidor de producción — bh-core
    - url: http://localhost:8080/bh-core/v1
      description: Entorno local — bh-core
  /usuarios/{usuarioId}/suspender:
    patch:
      tags:
      - Usuarios
      summary: Suspender cuenta de usuario
      description: El administrador desactiva una cuenta activa.
      operationId: suspenderUsuario
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/UsuarioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MotivoRequest'
      responses:
        '200':
          description: Cuenta suspendida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
    servers:
    - url: https://api.bh-vet.com/bh-core/v1
      description: Servidor de producción — bh-core
    - url: http://localhost:8080/bh-core/v1
      description: Entorno local — bh-core
  /clientes:
    get:
      tags:
      - Clientes
      summary: Listar clientes
      description: '**Roles permitidos**: `recepcionista`, `administrador`.

        '
      operationId: listarClientes
      security:
      - BearerAuth: []
      parameters:
      - name: busqueda
        in: query
        description: Filtrar por nombre, apellido o correo
        schema:
          type: string
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Lista paginada de clientes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedClientes'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Clientes
      summary: Registrar cliente
      description: 'La recepcionista registra un nuevo cliente con sus datos de contacto.


        **Roles permitidos**: `recepcionista`.

        '
      operationId: crearCliente
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteRequest'
      responses:
        '201':
          description: Cliente registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Ya existe un cliente con ese correo o documento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    servers:
    - url: https://api.bh-vet.com/bh-core/v1
      description: Servidor de producción — bh-core
    - url: http://localhost:8080/bh-core/v1
      description: Entorno local — bh-core
  /clientes/{clienteId}:
    get:
      tags:
      - Clientes
      summary: Obtener cliente por ID
      description: '**Roles permitidos**: `recepcionista`, `administrador`. El propio
        cliente puede

        consultar su información usando su token.

        '
      operationId: obtenerCliente
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ClienteId'
      responses:
        '200':
          description: Datos del cliente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Clientes
      summary: Actualizar datos del cliente
      description: '**Roles permitidos**: `recepcionista`.

        '
      operationId: actualizarCliente
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ClienteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteRequest'
      responses:
        '200':
          description: Cliente actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    servers:
    - url: https://api.bh-vet.com/bh-core/v1
      description: Servidor de producción — bh-core
    - url: http://localhost:8080/bh-core/v1
      description: Entorno local — bh-core
  /clientes/{clienteId}/mascotas:
    get:
      tags:
      - Mascotas
      summary: Listar mascotas de un cliente
      description: '**Roles permitidos**: `recepcionista`, `veterinario`, `administrador`,
        y el propio `cliente`.

        '
      operationId: listarMascotasDeCliente
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ClienteId'
      responses:
        '200':
          description: Lista de mascotas del cliente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Mascota'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Mascotas
      summary: Registrar mascota para un cliente
      description: '**Roles permitidos**: `recepcionista`.

        '
      operationId: crearMascota
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ClienteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MascotaRequest'
      responses:
        '201':
          description: Mascota registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mascota'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    servers:
    - url: https://api.bh-vet.com/bh-core/v1
      description: Servidor de producción — bh-core
    - url: http://localhost:8080/bh-core/v1
      description: Entorno local — bh-core
  /mascotas/{mascotaId}:
    get:
      tags:
      - Mascotas
      summary: Obtener mascota por ID
      operationId: obtenerMascota
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/MascotaId'
      responses:
        '200':
          description: Datos de la mascota.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mascota'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Mascotas
      summary: Actualizar datos de la mascota
      description: '**Roles permitidos**: `recepcionista`. El peso se actualiza automáticamente

        también al registrar una consulta en el historial médico.

        '
      operationId: actualizarMascota
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/MascotaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MascotaRequest'
      responses:
        '200':
          description: Mascota actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mascota'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    servers:
    - url: https://api.bh-vet.com/bh-core/v1
      description: Servidor de producción — bh-core
    - url: http://localhost:8080/bh-core/v1
      description: Entorno local — bh-core
  /citas:
    get:
      tags:
      - Citas
      summary: Listar citas
      description: '- `cliente`: ve solo sus propias citas.

        - `veterinario`: ve solo las citas asignadas a él.

        - `recepcionista` / `administrador`: ven todas las citas.

        '
      operationId: listarCitas
      security:
      - BearerAuth: []
      parameters:
      - name: veterinarioId
        in: query
        schema:
          type: string
          format: uuid
        description: Filtrar por veterinario
      - name: mascotaId
        in: query
        schema:
          type: string
          format: uuid
        description: Filtrar por mascota
      - name: estado
        in: query
        schema:
          $ref: '#/components/schemas/EstadoCita'
      - name: fechaDesde
        in: query
        schema:
          type: string
          format: date
        description: Fecha de inicio del rango (YYYY-MM-DD)
      - name: fechaHasta
        in: query
        schema:
          type: string
          format: date
        description: Fecha de fin del rango (YYYY-MM-DD)
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Lista paginada de citas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedCitas'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags:
      - Citas
      summary: Agendar nueva cita
      description: 'Agenda una cita y registra el pago de los servicios seleccionados.

        **El pago es obligatorio** — sin él la cita no se confirma.

        El sistema valida que no exista cruce de horario para el veterinario asignado.

        Al confirmar, se envía un correo automático al cliente.


        **Roles permitidos**: `recepcionista`, `cliente`.

        '
      operationId: crearCita
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CitaRequest'
            example:
              mascotaId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              veterinarioId: 7cb94e91-1234-4321-b3fc-9d853f11bcd2
              fecha: '2025-08-15'
              hora: '10:00'
              servicioIds:
              - aab5c123-0000-0000-0000-000000000001
              - aab5c123-0000-0000-0000-000000000002
              pago:
                metodo: tarjeta
                referencia: TXN-20250815-001
      responses:
        '201':
          description: Cita confirmada y pago registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cita'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: El veterinario ya tiene una cita en ese horario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                codigo: HORARIO_OCUPADO
                mensaje: El veterinario ya tiene una cita agendada en ese horario.
        '422':
          description: Pago rechazado o información de pago incompleta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    servers:
    - url: https://api.bh-vet.com/bh-core/v1
      description: Servidor de producción — bh-core
    - url: http://localhost:8080/bh-core/v1
      description: Entorno local — bh-core
  /citas/{citaId}:
    get:
      tags:
      - Citas
      summary: Obtener cita por ID
      operationId: obtenerCita
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CitaId'
      responses:
        '200':
          description: Datos de la cita.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cita'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    servers:
    - url: https://api.bh-vet.com/bh-core/v1
      description: Servidor de producción — bh-core
    - url: http://localhost:8080/bh-core/v1
      description: Entorno local — bh-core
  /citas/{citaId}/finalizar:
    patch:
      tags:
      - Citas
      summary: Marcar cita como finalizada
      description: 'Marca la cita como finalizada después de que el veterinario haya
        registrado el historial médico correspondiente.


        El registro clínico de la atención se crea previamente en `POST /mascotas/{mascotaId}/historial`,
