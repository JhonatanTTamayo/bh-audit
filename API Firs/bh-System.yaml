        - `recepcionista` / `administrador`: ven todas.

        '
      operationId: listarFacturas
      security:
      - BearerAuth: []
      parameters:
      - name: clienteId
        in: query
        schema:
          type: string
          format: uuid
      - name: estado
        in: query
        schema:
          $ref: '#/components/schemas/EstadoFactura'
      - name: fechaDesde
        in: query
        schema:
          type: string
          format: date
      - name: fechaHasta
        in: query
        schema:
          type: string
          format: date
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Lista paginada de facturas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedFacturas'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags:
      - Facturación
      summary: Generar factura
      description: 'La recepcionista genera la factura al terminar una atención. Refleja
        los

        servicios prestados (incluyendo los pagados al agendar) y los medicamentos

        adicionales despachados, con posibilidad de aplicar descuento.


        **Roles permitidos**: `recepcionista`.

        '
      operationId: crearFactura
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacturaRequest'
      responses:
        '201':
          description: Factura generada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factura'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    servers:
    - url: https://api.bh-vet.com/bh-core/v1
      description: Servidor de producción — bh-core
    - url: http://localhost:8080/bh-core/v1
      description: Entorno local — bh-core
  /facturas/{facturaId}:
    get:
      tags:
      - Facturación
      summary: Obtener factura por ID
      operationId: obtenerFactura
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/FacturaId'
      responses:
        '200':
          description: Datos de la factura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factura'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    servers:
    - url: https://api.bh-vet.com/bh-core/v1
      description: Servidor de producción — bh-core
    - url: http://localhost:8080/bh-core/v1
      description: Entorno local — bh-core
  /facturas/{facturaId}/anular:
    patch:
      tags:
      - Facturación
      summary: Anular factura
      description: 'Marca la factura como anulada. Se debe registrar el motivo.

        La anulación **no** borra el historial médico ni devuelve el inventario.


        **Roles permitidos**: `recepcionista`, `administrador`.

        '
      operationId: anularFactura
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/FacturaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MotivoRequest'
      responses:
        '200':
          description: Factura anulada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factura'
        '400':
          description: La factura ya está anulada o pagada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    servers:
    - url: https://api.bh-vet.com/bh-core/v1
      description: Servidor de producción — bh-core
    - url: http://localhost:8080/bh-core/v1
      description: Entorno local — bh-core
  /facturas/{facturaId}/pdf:
    get:
      tags:
      - Facturación
      summary: Descargar factura en PDF
      description: 'El cliente puede descargar su factura en PDF en cualquier momento
        desde su cuenta.


        **Roles permitidos**: `cliente` (solo sus propias facturas), `recepcionista`,
        `administrador`.

        '
      operationId: descargarFacturaPdf
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/FacturaId'
      responses:
        '200':
          description: Archivo PDF de la factura.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    servers:
    - url: https://api.bh-vet.com/bh-core/v1
      description: Servidor de producción — bh-core
    - url: http://localhost:8080/bh-core/v1
      description: Entorno local — bh-core
  /reportes/citas:
    get:
      tags:
      - Reportes
      summary: Reporte de citas por período (PDF)
      description: 'Listado de todas las citas en un rango de fechas con nombre del
        cliente,

        mascota, veterinario y estado final.


        **Roles permitidos**: `administrador`.

        '
      operationId: reporteCitas
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/FechaDesde'
      - $ref: '#/components/parameters/FechaHasta'
      responses:
        '200':
          description: Reporte PDF de citas.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    servers:
    - url: https://api.bh-vet.com/bh-core/v1
      description: Servidor de producción — bh-core
    - url: http://localhost:8080/bh-core/v1
      description: Entorno local — bh-core
  /reportes/facturacion:
    get:
      tags:
      - Reportes
      summary: Reporte de facturación por período (PDF)
      description: 'Resumen de facturas generadas en el rango, con total facturado,

        descuentos aplicados y estado.


        **Roles permitidos**: `administrador`.

        '
      operationId: reporteFacturacion
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/FechaDesde'
      - $ref: '#/components/parameters/FechaHasta'
      responses:
        '200':
          description: Reporte PDF de facturación.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    servers:
    - url: https://api.bh-vet.com/bh-core/v1
      description: Servidor de producción — bh-core
    - url: http://localhost:8080/bh-core/v1
      description: Entorno local — bh-core
  /reportes/inventario:
    get:
      tags:
      - Reportes
      summary: Reporte de inventario actual (PDF)
      description: 'Listado completo de productos con stock, precio unitario, vencimiento

        e identificación clara de productos críticos.


        **Roles permitidos**: `administrador`.

        '
      operationId: reporteInventario
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Reporte PDF de inventario.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    servers:
    - url: https://api.bh-vet.com/bh-core/v1
      description: Servidor de producción — bh-core
    - url: http://localhost:8080/bh-core/v1
      description: Entorno local — bh-core
  /reportes/historial-acciones:
    get:
      tags:
      - Reportes
      summary: Reporte de historial de acciones (PDF)
      description: 'Registro de todas las acciones ocurridas en el sistema en el rango
        de fechas,

        con usuario, rol, acción y fecha/hora exacta. bh-core consulta los datos a

        bh-audit para generar este reporte.


        **Roles permitidos**: `administrador`.

        '
      operationId: reporteHistorialAcciones
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/FechaDesde'
      - $ref: '#/components/parameters/FechaHasta'
      - name: usuarioId
        in: query
        schema:
          type: string
          format: uuid
        description: Filtrar por usuario específico
      - name: tipoAccion
        in: query
        schema:
          $ref: '#/components/schemas/TipoAccion'
      responses:
        '200':
          description: Reporte PDF del historial de acciones.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    servers:
    - url: https://api.bh-vet.com/bh-core/v1
      description: Servidor de producción — bh-core
    - url: http://localhost:8080/bh-core/v1
      description: Entorno local — bh-core
  /eventos:
    post:
      tags:
      - Audit — Trazabilidad
      summary: Registrar evento de auditoría
      description: '**Uso interno exclusivo.**


        bh-core notifica a bh-audit cada vez que ocurre una acción relevante en el
        sistema.

        Este endpoint no está expuesto al exterior del clúster de Kubernetes y solo
        debe ser

        invocado por bh-core mediante la cabecera `X-Internal-Service-Key`.


        Si bh-audit no está disponible momentáneamente, bh-core debe continuar operando
        con normalidad.

        '
      operationId: registrarEvento
      security:
      - InternalServiceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventoAuditoriaRequest'
            example:
              usuarioId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              nombreUsuario: María García
              rol: recepcionista
              tipoAccion: CREACION_CITA
              descripcion: Se agendó una cita para la mascota Luna.
              fechaHora: '2026-05-16T15:30:00Z'
              metadata:
                citaId: 9f83f23a-2f91-4c28-983c-3a41b102ab77
                mascotaId: 76411bdf-8448-4062-957e-6f784a9a3e91
      responses:
        '201':
          description: Evento registrado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoAuditoria'
        '400':
          $ref: '#/components/responses/AuditBadRequest'
        '401':
          $ref: '#/components/responses/AuditUnauthorized'
        '503':
          $ref: '#/components/responses/AuditServiceUnavailable'
    servers:
    - url: https://api.bh-vet.com/bh-audit/v1
      description: Servidor de producción — bh-audit
    - url: http://localhost:8081/bh-audit/v1
      description: Entorno local — bh-audit
  /eventos/consulta:
    get:
      tags:
      - Audit — Trazabilidad
      summary: Consultar historial de eventos
      description: '**Uso interno exclusivo.**


        bh-core invoca este endpoint para consultar el historial de acciones con filtros
        y generar

        el reporte PDF de trazabilidad. Este endpoint no debe exponerse directamente
        al exterior

        del clúster.

        '
      operationId: consultarEventos
      security:
      - InternalServiceKey: []
      parameters:
      - name: usuarioId
        in: query
        required: false
        description: Filtra los eventos ejecutados por un usuario específico.
        schema:
          type: string
          format: uuid
      - name: rol
        in: query
        required: false
        description: Filtra los eventos por rol del usuario que ejecutó la acción.
        schema:
          $ref: '#/components/schemas/RolUsuario'
      - name: tipoAccion
        in: query
        required: false
        description: Filtra los eventos por tipo de acción registrada.
        schema:
          $ref: '#/components/schemas/TipoAccion'
      - $ref: '#/components/parameters/FechaDesde'
      - $ref: '#/components/parameters/FechaHasta'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Historial de eventos paginado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedEventosAuditoria'
        '400':
          $ref: '#/components/responses/AuditBadRequest'
        '401':
          $ref: '#/components/responses/AuditUnauthorized'
        '503':
          $ref: '#/components/responses/AuditServiceUnavailable'
    servers:
    - url: https://api.bh-vet.com/bh-audit/v1
      description: Servidor de producción — bh-audit
    - url: http://localhost:8081/bh-audit/v1
      description: Entorno local — bh-audit
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT obtenido al iniciar sesión en `/auth/login`.
    InternalServiceKey:
      type: apiKey
      in: header
      name: X-Internal-Service-Key
      description: 'Clave de autenticación interna para comunicación entre microservicios

        (`bh-core` → `bh-audit`). No debe exponerse al exterior del clúster.

        '
  parameters:
    UsuarioId:
      name: usuarioId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClienteId:
      name: clienteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MascotaId:
      name: mascotaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CitaId:
      name: citaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RegistroId:
      name: registroId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HospitalizacionId:
      name: hospitalizacionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductoId:
      name: productoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ServicioId:
      name: servicioId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FacturaId:
      name: facturaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RolFiltro:
      name: rol
      in: query
      schema:
        $ref: '#/components/schemas/RolUsuario'
    EstadoCuentaFiltro:
      name: estado
      in: query
      schema:
        $ref: '#/components/schemas/EstadoCuenta'
    FechaDesde:
      name: fechaDesde
      in: query
      required: true
      schema:
        type: string
        format: date
      description: Fecha de inicio del rango (YYYY-MM-DD)
    FechaHasta:
      name: fechaHasta
      in: query
      required: true
      schema:
        type: string
        format: date
      description: Fecha de fin del rango (YYYY-MM-DD)
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0
      description: Número de página (base 0)
    Size:
      name: size
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
      description: Elementos por página
  responses:
    BadRequest:
      description: Datos de entrada inválidos o incompletos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            codigo: VALIDACION_FALLIDA
            mensaje: Los datos proporcionados no son válidos.
            detalles:
            - campo: email
              error: El formato del correo electrónico no es válido.
    Unauthorized:
      description: Token de autenticación ausente o inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            codigo: NO_AUTENTICADO
            mensaje: Se requiere autenticación para acceder a este recurso.
    Forbidden:
      description: El rol del usuario no tiene permiso para ejecutar esta acción.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            codigo: ACCESO_DENEGADO
            mensaje: Tu rol no tiene permiso para realizar esta operación.
    NotFound:
      description: El recurso solicitado no existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            codigo: RECURSO_NO_ENCONTRADO
            mensaje: El recurso solicitado no fue encontrado.
    AuditBadRequest:
      description: Datos de entrada inválidos, incompletos o filtros mal formados.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            codigo: VALIDACION_FALLIDA
            mensaje: Los datos proporcionados no son válidos.
            detalles:
            - campo: fechaDesde
              error: La fecha inicial debe tener formato YYYY-MM-DD.
    AuditUnauthorized:
      description: Clave interna ausente o inválida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            codigo: CLAVE_INTERNA_INVALIDA
            mensaje: Se requiere una clave interna válida para acceder a este recurso.
    AuditServiceUnavailable:
      description: El servicio de auditoría no puede procesar la solicitud temporalmente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            codigo: AUDITORIA_NO_DISPONIBLE
            mensaje: El servicio de auditoría no está disponible temporalmente.
  schemas:
    RolUsuario:
      type: string
      enum:
      - cliente
      - recepcionista
      - veterinario
      - administrador
      description: Rol del usuario en el sistema.
    EstadoCuenta:
      type: string
      enum:
      - pendiente_verificacion
      - pendiente_aprobacion
      - activo
      - rechazado
      - suspendido
      description: '- `pendiente_verificacion`: creó su cuenta pero aún no verificó
        el correo.

        - `pendiente_aprobacion`: verificó el correo (recepcionista/veterinario),
        esperando al admin.

        - `activo`: puede iniciar sesión.

        - `rechazado`: solicitud rechazada por el administrador.

        - `suspendido`: cuenta desactivada por el administrador.

        '
    EstadoMascota:
      type: string
      enum:
      - activa
      - hospitalizada
      - fallecida
    EstadoCita:
      type: string
      enum:
      - confirmada
      - finalizada
      - cancelada
    EstadoFactura:
      type: string
      enum:
      - pendiente_pago
      - pagada
      - anulada
    TipoProducto:
      type: string
      enum:
      - medicamento
      - vacuna
      - insumo_quirurgico
    EstadoEgreso:
      type: string
      enum:
      - recuperada
      - fallecida
      - trasladada
    TipoAccion:
      type: string
      enum:
      - REGISTRO_USUARIO
      - VERIFICACION_CORREO
      - APROBACION_CUENTA
      - RECHAZO_CUENTA
      - LOGIN_EXITOSO
      - LOGIN_FALLIDO
      - CREACION_CITA
      - CAMBIO_ESTADO_CITA
      - PAGO_CITA
      - CREACION_HISTORIAL
      - EDICION_HISTORIAL
      - REGISTRO_VACUNA
      - INICIO_HOSPITALIZACION
      - ALTA_HOSPITALIZACION
      - CREACION_FACTURA
      - ANULACION_FACTURA
      - AJUSTE_INVENTARIO
      - CREACION_SERVICIO
      - EDICION_SERVICIO
      - DESACTIVACION_SERVICIO
      - SUSPENSION_USUARIO
    RegistroRequest:
      type: object
      required:
      - nombre
      - email
      - password
      - telefono
      - rol
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 100
          example: María García
        email:
          type: string
          format: email
          example: maria@ejemplo.com
        password:
          type: string
          format: password
          minLength: 8
          description: Mínimo 8 caracteres, debe incluir mayúsculas, minúsculas y
            números.
        telefono:
          type: string
          pattern: ^[0-9]{7,15}$
          example: '3001234567'
        rol:
          $ref: '#/components/schemas/RolUsuario'
    VerificacionCorreoRequest:
      type: object
      required:
      - email
      - codigo
      properties:
        email:
          type: string
          format: email
        codigo:
          type: string
          minLength: 6
          maxLength: 6
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    MotivoRequest:
      type: object
      required:
      - motivo
      properties:
        motivo:
          type: string
          minLength: 5
          maxLength: 500
          example: El cliente solicitó cancelación por cambio de planes.
    ClienteRequest:
      type: object
      required:
      - nombre
      - apellido
      - email
      - telefono
      - documento
      properties:
        nombre:
          type: string
          example: Juan
        apellido:
          type: string
          example: Pérez
        email:
          type: string
          format: email
        telefono:
          type: string
        documento:
          type: string
          description: Número de cédula o documento de identidad
        direccion:
          type: string
    MascotaRequest:
      type: object
      required:
      - nombre
      - especie
      - raza
      - color
      - fechaNacimiento
      - peso
      properties:
        nombre:
          type: string
          example: Luna
        especie:
          type: string
          example: Perro
        raza:
          type: string
          example: Golden Retriever
        color:
          type: string
          example: Dorado
        fechaNacimiento:
          type: string
          format: date
          example: '2020-03-15'
        peso:
          type: number
          format: float
          minimum: 0
          example: 12.5
          description: Peso en kilogramos
    CitaRequest:
      type: object
      required:
      - mascotaId
      - veterinarioId
      - fecha
      - hora
      - servicioIds
      - pago
      properties:
        mascotaId:
          type: string
          format: uuid
        veterinarioId:
          type: string
          format: uuid
        fecha:
          type: string
          format: date
        hora:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: '10:00'
        servicioIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
        pago:
          $ref: '#/components/schemas/PagoRequest'
    PagoRequest:
      type: object
      required:
      - metodo
      properties:
        metodo:
          type: string
          enum:
          - efectivo
          - tarjeta
          - transferencia
        referencia:
          type: string
          description: Referencia de la transacción (requerida para tarjeta y transferencia)
    HistorialMedicoRequest:
      type: object
      required:
      - citaId
      - motivoVisita
      - diagnostico
      - tratamiento
      - peso
      properties:
        citaId:
          type: string
          format: uuid
        motivoVisita:
          type: string
        diagnostico:
          type: string
        tratamiento:
          type: string
        medicamentosPrescritos:
          type: array
          items:
            $ref: '#/components/schemas/MedicamentoPrescritoRequest'
        peso:
          type: number
          format: float
          minimum: 0
          description: Peso actual de la mascota en kg (actualiza el registro de la
            mascota)
        fechaProximaVisita:
          type: string
          format: date
    MedicamentoPrescritoRequest:
      type: object
      required:
      - productoId
      - dosis
      - duracion
      properties:
        productoId:
          type: string
          format: uuid
          description: ID del producto en inventario
        dosis:
          type: string
          example: 1 tableta cada 12 horas
        duracion:
          type: string
          example: 7 días
    VacunaRequest:
      type: object
      required:
      - nombre
      - fechaAplicacion
      - fechaProximaDosis
      properties:
        nombre:
          type: string
          example: Parvovirus + Distemper
        productoId:
          type: string
          format: uuid
          description: ID del producto en inventario (opcional, para descuento automático)
        fechaAplicacion:
          type: string
          format: date
        fechaProximaDosis:
          type: string
          format: date
        observaciones:
          type: string
    HospitalizacionRequest:
      type: object
      required:
      - motivoIngreso
      - veterinarioId
      properties:
        motivoIngreso:
          type: string
        veterinarioId:
          type: string
          format: uuid
        observacionesIniciales:
          type: string
    NotaEvolucionRequest:
      type: object
      required:
      - nota
      properties:
        nota:
          type: string
          description: Descripción del estado de la mascota en el día
    AltaRequest:
      type: object
      required:
      - estadoEgreso
      - observaciones
      properties:
        estadoEgreso:
          $ref: '#/components/schemas/EstadoEgreso'
        observaciones:
          type: string
    ProductoRequest:
      type: object
      required:
      - nombre
      - tipo
      - stockDisponible
      - stockMinimo
      - precio
      - fechaVencimiento
      properties:
        nombre:
          type: string
        tipo:
          $ref: '#/components/schemas/TipoProducto'
        stockDisponible:
          type: integer
          minimum: 0
        stockMinimo:
          type: integer
          minimum: 0
          description: Umbral mínimo; por debajo genera alerta
        precio:
          type: number
          format: float
          minimum: 0
        fechaVencimiento:
          type: string
          format: date
        descripcion:
          type: string
    ServicioRequest:
      type: object
      required:
      - nombre
      - precio
      properties:
        nombre:
          type: string
          example: Consulta general
        descripcion:
          type: string
        precio:
          type: number
          format: float
          minimum: 0
    FacturaRequest:
      type: object
      required:
      - citaId
      properties:
        citaId:
          type: string
          format: uuid
        medicamentosAdicionales:
          type: array
          items:
            $ref: '#/components/schemas/ItemFacturaRequest'
          description: Medicamentos despachados adicionales no incluidos en el pago
            inicial
        descuento:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Porcentaje de descuento (0–100)
    ItemFacturaRequest:
      type: object
      required:
      - productoId
      - cantidad
      properties:
        productoId:
          type: string
          format: uuid
        cantidad:
          type: integer
          minimum: 1
    MensajeResponse:
      type: object
      properties:
        mensaje:
          type: string
    ErrorResponse:
      type: object
      required:
      - codigo
      - mensaje
      properties:
        codigo:
          type: string
          description: Código de error interno del sistema
        mensaje:
          type: string
          description: Descripción legible del error
        detalles:
          type: array
          items:
            type: object
            properties:
              campo:
                type: string
              error:
                type: string
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT de acceso
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          description: Tiempo de expiración en segundos
          example: 3600
        usuario:
          $ref: '#/components/schemas/Usuario'
    Usuario:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        email:
          type: string
          format: email
        telefono:
          type: string
        rol:
          $ref: '#/components/schemas/RolUsuario'
        estadoCuenta:
          $ref: '#/components/schemas/EstadoCuenta'
        creadoEn:
          type: string
          format: date-time
        actualizadoEn:
          type: string
          format: date-time
    Cliente:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        apellido:
          type: string
        email:
          type: string
          format: email
        telefono:
          type: string
        documento:
          type: string
        direccion:
          type: string
        creadoEn:
          type: string
          format: date-time
    Mascota:
      type: object
      properties:
        id:
          type: string
          format: uuid
        clienteId:
          type: string
          format: uuid
        nombre:
          type: string
        especie:
          type: string
        raza:
          type: string
        color:
          type: string
        fechaNacimiento:
          type: string
          format: date
        peso:
          type: number
          format: float
          description: Último peso registrado (kg)
        estado:
          $ref: '#/components/schemas/EstadoMascota'
        creadoEn:
          type: string
          format: date-time
        actualizadoEn:
          type: string
          format: date-time
    Cita:
      type: object
      properties:
        id:
          type: string
          format: uuid
        mascota:
          $ref: '#/components/schemas/Mascota'
        veterinario:
          $ref: '#/components/schemas/Usuario'
        fecha:
          type: string
          format: date
        hora:
          type: string
          example: '10:00'
        servicios:
          type: array
          items:
            $ref: '#/components/schemas/Servicio'
        montoTotal:
          type: number
          format: float
        pago:
          $ref: '#/components/schemas/Pago'
        estado:
          $ref: '#/components/schemas/EstadoCita'
        motivoCancelacion:
          type: string
          nullable: true
        creadoEn:
          type: string
          format: date-time
    Pago:
      type: object
      properties:
        id:
          type: string
          format: uuid
        metodo:
          type: string
        referencia:
          type: string
        monto:
          type: number
          format: float
        fechaPago:
          type: string
          format: date-time
    HistorialMedico:
      type: object
      properties:
        id:
          type: string
          format: uuid
        mascotaId:
          type: string
          format: uuid
        citaId:
          type: string
          format: uuid
        veterinario:
          $ref: '#/components/schemas/Usuario'
        motivoVisita:
          type: string
        diagnostico:
          type: string
        tratamiento:
          type: string
        medicamentosPrescritos:
          type: array
          items:
            $ref: '#/components/schemas/MedicamentoPrescrito'
        peso:
          type: number
          format: float
        fechaProximaVisita:
          type: string
          format: date
          nullable: true
        creadoEn:
          type: string
          format: date-time
        editableHasta:
          type: string
          format: date-time
          description: Timestamp hasta el cual el veterinario puede editar el registro
            (24h después de creación)
    MedicamentoPrescrito:
      type: object
      properties:
        productoId:
          type: string
          format: uuid
        nombreProducto:
          type: string
        dosis:
          type: string
        duracion:
          type: string
    Vacuna:
      type: object
      properties:
        id:
          type: string
          format: uuid
        mascotaId:
          type: string
          format: uuid
        nombre:
          type: string
        productoId:
          type: string
          format: uuid
          nullable: true
        fechaAplicacion:
          type: string
          format: date
        fechaProximaDosis:
          type: string
          format: date
        observaciones:
          type: string
          nullable: true
        veterinario:
          $ref: '#/components/schemas/Usuario'
    AlertaVacuna:
      type: object
      properties:
        mascota:
          $ref: '#/components/schemas/Mascota'
        cliente:
          $ref: '#/components/schemas/Cliente'
        vacuna:
          $ref: '#/components/schemas/Vacuna'
        diasRestantes:
          type: integer
          description: Días que faltan para el vencimiento de la dosis
    Hospitalizacion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        mascota:
          $ref: '#/components/schemas/Mascota'
        veterinario:
          $ref: '#/components/schemas/Usuario'
        fechaIngreso:
          type: string
          format: date-time
        motivoIngreso:
          type: string
        notasEvolucion:
          type: array
          items:
            $ref: '#/components/schemas/NotaEvolucion'
        fechaEgreso:
          type: string
          format: date-time
          nullable: true
        estadoEgreso:
          allOf:
          - $ref: '#/components/schemas/EstadoEgreso'
          nullable: true
    NotaEvolucion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fecha:
          type: string
          format: date
        nota:
          type: string
        veterinario:
          $ref: '#/components/schemas/Usuario'
    Producto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        tipo:
          $ref: '#/components/schemas/TipoProducto'
        stockDisponible:
          type: integer
        stockMinimo:
          type: integer
        precio:
          type: number
          format: float
        fechaVencimiento:
          type: string
          format: date
        descripcion:
          type: string
          nullable: true
        stockBajo:
          type: boolean
          description: 'Calculado: `stockDisponible < stockMinimo`'
        proximoAVencer:
          type: boolean
          description: 'Calculado: vence en los próximos 30 días'
    Servicio:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        descripcion:
          type: string
          nullable: true
        precio:
          type: number
          format: float
        activo:
          type: boolean
    Factura:
      type: object
      properties:
        id:
          type: string
          format: uuid
        cita:
          $ref: '#/components/schemas/Cita'
        cliente:
          $ref: '#/components/schemas/Cliente'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemFactura'
        subtotal:
          type: number
          format: float
        descuentoPorcentaje:
          type: number
          format: float
        descuentoValor:
          type: number
          format: float
        montoYaPagado:
          type: number
          format: float
          description: Monto pagado al momento de agendar la cita
        saldoRestante:
          type: number
          format: float
        total:
          type: number
          format: float
        estado:
          $ref: '#/components/schemas/EstadoFactura'
        motivoAnulacion:
          type: string
          nullable: true
        generadaEn:
          type: string
          format: date-time
        generadaPor:
          $ref: '#/components/schemas/Usuario'
    ItemFactura:
      type: object
      properties:
        descripcion:
          type: string
        cantidad:
          type: integer
        precioUnitario:
          type: number
          format: float
        subtotal:
          type: number
          format: float
        tipo:
          type: string
          enum:
          - servicio
          - medicamento
    PagedUsuarios:
      allOf:
      - $ref: '#/components/schemas/PaginationMeta'
      - type: object
        properties:
          content:
            type: array
            items:
              $ref: '#/components/schemas/Usuario'
    PagedClientes:
      allOf:
      - $ref: '#/components/schemas/PaginationMeta'
      - type: object
        properties:
          content:
            type: array
            items:
              $ref: '#/components/schemas/Cliente'
    PagedCitas:
      allOf:
      - $ref: '#/components/schemas/PaginationMeta'
      - type: object
        properties:
          content:
            type: array
            items:
              $ref: '#/components/schemas/Cita'
    PagedHistorialMedico:
      allOf:
      - $ref: '#/components/schemas/PaginationMeta'
      - type: object
        properties:
          content:
            type: array
            items:
              $ref: '#/components/schemas/HistorialMedico'
    PagedProductos:
      allOf:
      - $ref: '#/components/schemas/PaginationMeta'
      - type: object
        properties:
          content:
            type: array
            items:
              $ref: '#/components/schemas/Producto'
    PagedFacturas:
      allOf:
      - $ref: '#/components/schemas/PaginationMeta'
      - type: object
        properties:
          content:
            type: array
            items:
              $ref: '#/components/schemas/Factura'
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          description: Número de página actual (base 0)
        size:
          type: integer
          description: Tamaño de la página
        totalElements:
          type: integer
          description: Total de elementos en la colección
        totalPages:
          type: integer
          description: Total de páginas disponibles
        first:
          type: boolean
        last:
          type: boolean
    EventoAuditoriaRequest:
      type: object
      required:
      - tipoAccion
      - descripcion
      - fechaHora
      properties:
        usuarioId:
          type: string
          format: uuid
          nullable: true
          description: ID del usuario que ejecutó la acción. Puede ser nulo en eventos
            como login fallido.
        nombreUsuario:
          type: string
          nullable: true
          description: Nombre del usuario o identificador usado en la acción.
        rol:
          allOf:
          - $ref: '#/components/schemas/RolUsuario'
          nullable: true
          description: Rol del usuario. Puede ser nulo si la acción ocurrió antes
            de autenticar al usuario.
        tipoAccion:
          $ref: '#/components/schemas/TipoAccion'
        descripcion:
          type: string
          minLength: 5
          maxLength: 1000
          description: Descripción legible de la acción ejecutada.
        fechaHora:
          type: string
          format: date-time
          description: Fecha y hora exacta en que ocurrió la acción.
        metadata:
          type: object
          additionalProperties: true
          nullable: true
          description: Datos adicionales del evento, por ejemplo ID del recurso afectado.
    EventoAuditoria:
      type: object
      properties:
        id:
          type: string
          format: uuid
        usuarioId:
          type: string
          format: uuid
          nullable: true
        nombreUsuario:
          type: string
          nullable: true
        rol:
          allOf:
          - $ref: '#/components/schemas/RolUsuario'
          nullable: true
        tipoAccion:
          $ref: '#/components/schemas/TipoAccion'
        descripcion:
          type: string
        fechaHora:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        creadoEn:
          type: string
          format: date-time
          description: Fecha y hora en que bh-audit almacenó el evento.
    PagedEventosAuditoria:
      allOf:
      - $ref: '#/components/schemas/PaginationMeta'
      - type: object
        properties:
          content:
            type: array
            items:
              $ref: '#/components/schemas/EventoAuditoria'
